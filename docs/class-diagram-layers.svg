<text x="408" y="434.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B6A63">calls</text>
<path d="M400,600 L400,640" fill="none" stroke="#3A3C42" stroke-width="1.2" marker-end="url(#open)"/>
<text x="408" y="624.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B6A63">opens</text>
<path d="M700,450 L700,425 L700,410" fill="none" stroke="#3A3C42" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#tri)"/>
</svg>
